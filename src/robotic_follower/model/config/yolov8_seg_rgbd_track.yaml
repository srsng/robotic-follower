perception:
  name: yolov8_seg_rgbd_track
  global:
    depth_valid_ratio_min: 0.35
    mask_area_min_px: 200
    mask_area_max_ratio: 0.40
    mask_aspect_ratio_max: 6.0
    mask_erode_kernel: 3
    mask_erode_iterations: 1
    z_trim_quantile: 0.08
    max_non_person_distance_m: 1.2
    occlusion_ratio_max_for_grasp: 0.45
    detection_merge_dist_m: 0.10
    detection_merge_iou_min: 0.18
    exclude_labels:
      - dining table
      - couch
      - bed
      - refrigerator
      - oven
      - microwave
      - sink
      - clock
      - vase
      - potted plant

  detector:
    pre:
      - type: segment
        segmenter:
          type: yolov8_seg
          model_path: yolov8s-seg.pt
          conf_threshold: 0.35
          iou_threshold: 0.50
      - type: mask_clean
        params:
          mask_area_min_px: ${mask_area_min_px}
          mask_area_max_ratio: ${mask_area_max_ratio}
          exclude_labels: ${exclude_labels}
      - type: mask_erode
        params:
          mask_erode_kernel: ${mask_erode_kernel}
          mask_erode_iterations: ${mask_erode_iterations}

    process:
      - type: segment_and_project
        params:
          depth_valid_ratio_min: ${depth_valid_ratio_min}
          mask_aspect_ratio_max: ${mask_aspect_ratio_max}
          z_trim_quantile: ${z_trim_quantile}
          max_non_person_distance_m: ${max_non_person_distance_m}
          occlusion_ratio_max_for_grasp: ${occlusion_ratio_max_for_grasp}

    post:
      - type: distance_gate
        params:
          max_non_person_distance_m: ${max_non_person_distance_m}
      - type: detection_merge
        params:
          detection_merge_dist_m: ${detection_merge_dist_m}
          detection_merge_iou_min: ${detection_merge_iou_min}
      - type: table_estimate
        params:
          table_z: 0.0
          table_margin_m: 0.01
          table_reestimate_interval_s: 2.0
          table_reestimate_min_inlier_ratio: 0.35

  tracker:
    enabled: true
    process:
      - type: kalman3d
        params:
          association_dist_gate_m: 0.50
          duplicate_track_dist_m: 0.15
          max_age: 30
          min_hits: 1
