perception:
  name: density_votenet_to_scene_70c
  global: {}

  detector:
    pre: []
    process:
      - type: mmdet3d
        params:
          name: Density VoteNet-TO-Scene
          config_file: ~/ros2_ws/src/robotic_follower/model/detection/density_votenet/density_votenet_to_scene-70c.py
          checkpoint_file: ~/ros2_ws/src/robotic_follower/model/detection/density_votenet/density_votenet_to_scene-70c.pth
          device: cuda:0
          score_threshold: 0.5
          ignore_class_names:
            - bed
            - cabinet
            - chair
            - sofa
            - table
            - door
            - window
            - bookshelf
            - picture
            - counter
            - desk
            - curtain
            - refrigerator
            - showercurtrain
            - toilet
            - sink
            - bathtub
            - garbagebin
    post: []

  tracker:
    enabled: false
